name: Build unsigned Flutter iOS IPA

on:
  workflow_dispatch:
    inputs:
      runner_os:
        description: 'macOS Runner OS'
        required: true
        default: 'macos-latest'
        type: choice
        options:
          - 'macos-latest'
          - 'macos-15'

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: ${{ inputs.runner_os || 'macos-latest' }}
    timeout-minutes: 45

    defaults:
      run:
        working-directory: studentportal01

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          xcodebuild -version

      - name: Disable Swift Package Manager in Flutter
        run: flutter config --no-enable-swift-package-manager

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Install iOS dependencies (CocoaPods)
        run: |
          cd ios
          pod install --repo-update

      - name: Build iOS app without signing
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Runner.app was not generated."
            find build/ios -maxdepth 4 -name "*.app" -print || true
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/Runner.app
          mkdir -p dist "$GITHUB_WORKSPACE/dist"
          /usr/bin/zip -qry dist/studentportal-unsigned.ipa Payload
          cp dist/studentportal-unsigned.ipa "$GITHUB_WORKSPACE/dist/studentportal-unsigned.ipa"
          test -s dist/studentportal-unsigned.ipa
          ls -lh dist/studentportal-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: studentportal-unsigned-ipa
          path: studentportal01/dist/studentportal-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
